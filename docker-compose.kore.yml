# The deployed shape: one core (a compile is single-threaded), 1200M for a ~960 MiB peak, no IR cache volume
# since the cache ships trained in the image and takes one writer.
services:
  kore-playground-server:
    image: ghcr.io/kore-minecraft/kore-playground-server:latest
    restart: unless-stopped

    environment:
      ACCESS_CONTROL_ALLOW_ORIGIN_VALUE: "https://kore.ayfri.com,http://localhost:[*]"

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1200M
        reservations:
          memory: 512M

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/versions || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
