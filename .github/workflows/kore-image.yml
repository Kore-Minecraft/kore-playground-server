# Builds, smoke tests and pushes the image to GHCR, then has Dokploy pull it; the build is too heavy for the deploy box.
name: Kore playground image

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: kore-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kore-minecraft/kore-playground-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the Kotlin and Kore versions
        id: versions
        run: |
          kotlin=$(awk '{ if ($1 == "kotlin") { gsub(/"/, "", $2); print $2; } }' FS=' = ' ./gradle/libs.versions.toml)
          kore=$(sed -n 's/^val koreVersion = "\(.*\)"$/\1/p' dependencies/build.gradle.kts)
          test -n "$kotlin" && test -n "$kore"
          echo "kotlin=$kotlin" >> "$GITHUB_OUTPUT"
          echo "kore=$kore" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # On the host because a Docker layer cannot keep the Gradle caches between runs.
      - name: Build the server
        run: ./gradlew :bootJar -Pkore.slim=true --build-cache

      # Seeds the training run with the previous build's IR cache; a Kotlin or Kore bump starts a new lineage.
      - name: Restore the trained IR cache
        uses: actions/cache@v6
        with:
          path: ir-cache-seed
          key: kore-ir-${{ steps.versions.outputs.kotlin }}-${{ steps.versions.outputs.kore }}-${{ hashFiles('kore-prewarm/**', 'src/main/kotlin/com/compiler/server/kore/**') }}-${{ github.sha }}
          restore-keys: |
            kore-ir-${{ steps.versions.outputs.kotlin }}-${{ steps.versions.outputs.kore }}-${{ hashFiles('kore-prewarm/**', 'src/main/kotlin/com/compiler/server/kore/**') }}-

      - name: Make sure the seed directory exists
        run: mkdir -p ir-cache-seed

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded, not pushed, so the smoke test runs against the exact bytes first.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          build-args: |
            KOTLIN_VERSION=${{ steps.versions.outputs.kotlin }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:kore-${{ steps.versions.outputs.kore }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both caches shipped and are used, and a snippet no prewarm snippet resembles compiles under the deployed limits.
      - name: Smoke test the image
        run: |
          set -euo pipefail

          docker run -d --name smoke --cpus 1.0 --memory 1200m -p 8080:8080 "$IMAGE:$GITHUB_SHA"

          docker exec smoke test -f /kotlin-compiler-server/app.aot || { echo "smoke: the AOT cache is missing from the image" >&2; exit 1; }
          # The JVM is the entrypoint shell's child; `[e]` keeps grep from matching itself.
          docker exec smoke sh -c "grep -qa 'AOTCach[e]' /proc/[0-9]*/cmdline" || { echo "smoke: the JVM started without the AOT cache" >&2; exit 1; }
          test -n "$(docker exec smoke sh -c 'ls -A /kotlin-compiler-server/ir-cache')" || { echo "smoke: the IR cache shipped empty" >&2; exit 1; }

          for attempt in $(seq 1 90); do
            docker logs smoke 2>&1 | grep -q 'warmup: JIT warmed' && break
            sleep 5
          done

          PREWARM_SNIPPETS=kore-prewarm/smoke PREWARM_HARNESS=kore-prewarm/harness.kt ./kore-prewarm/prewarm.sh | tee smoke.log || { docker logs smoke; exit 1; }

          elapsed=$(sed -n 's/^prewarm: .* - \([0-9][0-9]*\)s, .*$/\1/p' smoke.log | head -1)
          test -n "$elapsed" || { echo "smoke: no compile time in the output" >&2; exit 1; }

          echo "smoke: the unseen snippet compiled in ${elapsed}s"
          # An empty cache costs ~104 s and a trained one ~15 s.
          test "$elapsed" -lt 45 || { echo "smoke: the prewarmed cache did not ship, or it is stale" >&2; exit 1; }

      - name: Stop the smoke container
        if: always()
        run: docker rm -f smoke || true

      - name: Export the trained IR cache for the next run
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ir-cache-export
          build-args: |
            KOTLIN_VERSION=${{ steps.versions.outputs.kotlin }}
          outputs: type=local,dest=ir-cache-seed
          cache-from: type=gha

      - name: Push the image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:kore-${{ steps.versions.outputs.kore }}"
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Tell Dokploy to pull the new image
        if: github.ref == 'refs/heads/master'
        run: curl -sf -X POST "${{ secrets.DOKPLOY_DEPLOY_HOOK }}"
